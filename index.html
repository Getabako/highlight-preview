<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ハイライト動画 確認用</title>
<style>
  html { font-size: 17px; }
  body { margin: 0; background: #111; color: #f3f3f3; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; letter-spacing: 0.04em; line-height: 1.8; }
  header { padding: 1.2rem 1.2rem 0.6rem; }
  h1 { font-size: 1.3rem; margin: 0 0 0.3rem; }
  p.note { margin: 0; color: #aaa; font-size: 0.95rem; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.2rem; padding: 1rem 1.2rem 3rem; }
  section { background: #1c1c1c; border-radius: 14px; overflow: hidden; }
  video { display: block; width: 100%; aspect-ratio: 9 / 16; background: #000; }
  .cap { padding: 0.8rem 1rem 1rem; }
  .cap b { display: block; font-size: 1.1rem; }
  .cap span { color: #bbb; font-size: 0.95rem; }
  .cap a { display: inline-block; margin-top: 0.4rem; color: #ffd23a; font-size: 0.95rem; }
</style>
</head>
<body>
<header>
  <h1>Instagram ハイライト動画（確認用）</h1>
  <p class="note">タップで再生。音は端末側で。保存はリンクを長押し。<span id="upd"></span></p>
</header>
<main id="list"></main>
<script>
const items = [
  ["01-about", "Ashuraとは", "納品品質の奥義33本＋講座・グルコン・作業会の伴走支援。1ヶ月無料"],
  ["02-signup", "登録の手順", "リンク → 登録 → 奥義カードから導入"],
  ["03-howto", "奥義の使い方", "貼る → 起動 → ひと言。実際のプロンプトと出力"],
  ["04-catalog", "奥義33本", "カタログをスクロールで見せる"],
  ["05-results", "できたもの", "LP・スライド・自動投稿の実物"],
  ["06-support", "詰まったら", "作業会と個別相談で一緒に動かす"],
  ["07-book", "本を出す理由", "本は発信の原液。KindleMaker → 戦略 → 全SNSへ自動投稿"],
];
const v = new URLSearchParams(location.search).get("v") || "";
const q = v ? `?v=${encodeURIComponent(v)}` : "";
document.getElementById("list").innerHTML = items.map(([id, t, d]) => `
  <section>
    <video controls playsinline preload="metadata" poster="v/${id}.jpg${q}" src="v/${id}.mp4${q}"></video>
    <div class="cap"><b>${t}</b><span>${d}</span><br><a href="v/${id}.mp4${q}" download="${id}.mp4">この動画を保存</a></div>
  </section>`).join("");
</script>
</body>
</html>
